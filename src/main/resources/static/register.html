<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | StyleSync AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #faf8f5;
            color: #222222;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
        }

        .logo {
            margin-bottom: 28px;
            text-align: center;
            font-size: 27px;
            font-weight: 800;
        }

        .logo span {
            color: #a45b45;
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #777777;
            text-align: center;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #a45b45;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 5px;
            background: #222222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #a45b45;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .links {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #a45b45;
            text-decoration: none;
        }

        .password-hint {
            margin-top: 7px;
            color: #777777;
            font-size: 12px;
        }
    </style>
</head>

<body>
<main class="register-card">
    <div class="logo">StyleSync<span>AI</span></div>

    <h1>Create your account</h1>
    <p class="subtitle">
        Join StyleSync AI and discover your personal style.
    </p>

    <form id="register-form">
        <label for="name">Full name</label>
        <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                autocomplete="name"
                required
        >

        <label for="email">Email address</label>
        <input
                type="email"
                id="email"
                name="email"
                maxlength="254"
                autocomplete="email"
                required
        >

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
        >
        <p class="password-hint">
            Use a password containing 8 to 72 characters.
        </p>

        <button type="submit" id="register-button">
            Create Account
        </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
        Already have an account?
        <a href="/login.html">Log in</a>
        <br><br>
        <a href="/">Back to home</a>
    </div>
</main>

<script>
    const form = document.getElementById("register-form");
    const message = document.getElementById("message");
    const button = document.getElementById("register-button");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "";
        button.disabled = true;
        button.textContent = "Creating account...";

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!name) {
            message.textContent = "Please enter your name.";
            button.disabled = false;
            button.textContent = "Create Account";
            return;
        }

        if (password.length < 8 || password.length > 72) {
            message.textContent =
                "Password must contain 8 to 72 characters.";
            button.disabled = false;
            button.textContent = "Create Account";
            return;
        }

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    data.detail ||
                    data.message ||
                    "Registration failed. Please try again."
                );
            }

            if (!data.accessToken) {
                throw new Error(
                    "Account response did not contain an access token."
                );
            }

            sessionStorage.setItem("accessToken", data.accessToken);

            // A new account must not reuse a cart ID from another session.
            sessionStorage.removeItem("cartId");

            message.textContent =
                "Account created successfully! Opening StyleSync AI...";

            window.location.href = "/";

        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Create Account";
        }
    });
</script>
</body>
</html>
